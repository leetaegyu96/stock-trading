[project]
name = "simcore"
version = "0.1.0"
description = "규칙 기반 롱온리 페이퍼 트레이딩 시뮬레이터 엔진 코어"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pykrx>=1.0.45",
    "yfinance>=0.2.40",
    "pyarrow>=15",
    "lxml>=5",
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "APScheduler>=3.10",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # v2 (회원제 모의투자) — 인증
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["simcore*", "dashboard*", "v2*"]

[tool.pytest.ini_options]
# v1 엔진(tests)과 v2 앱(v2/tests)을 한 번에 수집한다 — 한쪽만 도는 설정이면
# 공용 모듈(simcore.names, kis_client)을 건드렸을 때 회귀를 놓친다.
testpaths = ["tests", "v2/tests"]
